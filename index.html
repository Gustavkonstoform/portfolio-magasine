<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Art Portfolio — Gustav Pregmark</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
    
    <style>
        @font-face {
            font-family: 'OCR A Extended';
            src: local('OCR A Extended'), local('OCRAExtended');
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #f3f4f6;
            color: #111827;
            font-family: 'Inter', -apple-system, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 40px;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-family: 'OCR A Extended', monospace;
            font-size: 12px;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        header a {
            color: inherit;
            text-decoration: none;
            opacity: 0.7;
            transition: opacity 0.2s;
        }

        header a:hover {
            opacity: 1;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            width: 100%;
            padding: 60px 0;
        }

        .intro {
            margin-bottom: 50px;
        }

        h1 {
            font-family: 'OCR A Extended', monospace;
            font-size: 14px;
            font-weight: 400;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 15px;
        }

        .intro p {
            font-size: 15px;
            opacity: 0.6;
            line-height: 1.5;
        }

        /* Magasinets sidor / bildlayout */
        .magazine-spread {
            display: flex;
            flex-direction: column;
            gap: 50px;
        }

        .magazine-page {
            width: 100%;
            background-color: #ffffff;
            box-shadow: 0 10px 25px rgba(0,0,0,0.06);
            border: 1px solid rgba(0,0,0,0.04);
            padding: 20px;
        }

        .magazine-page img {
            width: 100%;
            height: auto;
            display: block;
        }

        /* Ljudspelare */
        .audio-section {
            margin-top: 60px;
            padding: 20px;
            background: rgba(0,0,0,0.03);
            border-radius: 4px;
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .audio-label {
            font-family: 'OCR A Extended', monospace;
            font-size: 11px;
            letter-spacing: 1px;
            text-transform: uppercase;
            opacity: 0.6;
            white-space: nowrap;
        }

        audio {
            width: 100%;
        }

        footer {
            font-family: 'OCR A Extended', monospace;
            font-size: 11px;
            letter-spacing: 1px;
            opacity: 0.5;
            display: flex;
            justify-content: space-between;
        }

        @media (max-width: 768px) {
            body { padding: 20px; }
            .container { padding: 30px 0; }
        }
    </style>
</head>
<body>

    <header>
        <a href="index.html">← Kiosk Lobby</a>
        <span>Art Portfolio</span>
    </header>

    <main class="container">
        <div class="intro">
            <h1>Fine Arts & Visuals</h1>
            <p>Ett urval av konstprojekt, visualiseringar och experimentella uttryck.</p>
        </div>

        <!-- Alla bildsidor med korrekt mappnamn (images-art) -->
        <div class="magazine-spread">
            <div class="magazine-page"><img src="images-art/art-1.jpg" alt="Art 1"></div>
            <div class="magazine-page"><img src="images-art/art-2.jpg" alt="Art 2"></div>
            <div class="magazine-page"><img src="images-art/art-3.jpg" alt="Art 3"></div>
            <div class="magazine-page"><img src="images-art/art-4.jpg" alt="Art 4"></div>
            <div class="magazine-page"><img src="images-art/art-5.jpg" alt="Art 5"></div>
            <div class="magazine-page"><img src="images-art/art-6.jpg" alt="Art 6"></div>
            <div class="magazine-page"><img src="images-art/art-7.jpg" alt="Art 7"></div>
            <div class="magazine-page"><img src="images-art/art-8.jpg" alt="Art 8"></div>
            <div class="magazine-page"><img src="images-art/art-9.jpg" alt="Art 9"></div>
            <div class="magazine-page"><img src="images-art/art-10.jpg" alt="Art 10"></div>
            <div class="magazine-page"><img src="images-art/art-11.jpg" alt="Art 11"></div>
            <div class="magazine-page"><img src="images-art/art-12.jpg" alt="Art 12"></div>
            <div class="magazine-page"><img src="images-art/art-13.jpg" alt="Art 13"></div>
            <div class="magazine-page"><img src="images-art/art-14.jpg" alt="Art 14"></div>
        </div>

        <!-- Ljudspelare -->
        <div class="audio-section">
            <span class="audio-label">Ambient Audio</span>
            <audio controls>
                <source src="audio/ljudspår.mp3" type="audio/mp3">
                Din webbläsare stödjer inte ljudelementet.
            </audio>
        </div>
    </main>

    <footer>
        <span>© 2026</span>
        <span>All Rights Reserved</span>
    </footer>

</body>
</html>
